<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Base Value Lab (local only)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0a0a0b; color: #e5e5e5;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 64px; }
  header.top {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    justify-content: space-between; border-bottom: 1px solid #262626; padding-bottom: 12px;
  }
  h1 { font-size: 16px; margin: 0; display: flex; gap: 8px; align-items: center; }
  h2 { font-size: 12px; margin: 0 0 8px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  h3 { font-size: 20px; margin: 0; }
  .badge-local {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    border: 1px solid rgba(56,189,248,.4); background: rgba(14,165,233,.15);
    color: #bae6fd; border-radius: 999px; padding: 2px 8px;
  }
  .sub { color: #a3a3a3; font-size: 12px; margin: 2px 0 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select, input {
    background: #18181b; color: #e5e5e5; border: 1px solid #3f3f46;
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px;
  }
  input { min-width: 0; }
  button { cursor: pointer; }
  button:hover { border-color: #71717a; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #f4f4f5; color: #09090b; font-weight: 600; border-color: #f4f4f5; }
  button.timer { min-width: 46px; font-weight: 600; }
  button.danger { border-color: rgba(248,113,113,.5); color: #fca5a5; }
  button.link { background: none; border: none; color: #93c5fd; padding: 0; text-align: left; }
  section.card, .panel {
    border: 1px solid #27272a; background: #131316; border-radius: 12px; padding: 14px;
  }
  section.card { margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px; border-top: 1px solid #222; vertical-align: top; }
  th { color: #a3a3a3; font-weight: 500; border-top: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: #737373; }
  .pill { border: 1px solid #3f3f46; background: #27272a; border-radius: 999px; padding: 1px 8px; font-size: 11px; white-space: nowrap; }
  .st-confident { border-color: rgba(52,211,153,.5); background: rgba(6,78,59,.4); color: #a7f3d0; }
  .st-needs-confirmation { border-color: rgba(250,204,21,.45); background: rgba(113,63,18,.35); color: #fde68a; }
  .st-open, .st-untested { color: #d4d4d8; }
  .st-conflict { border-color: rgba(248,113,113,.5); background: rgba(127,29,29,.35); color: #fca5a5; }
  .st-too-high { border-color: rgba(167,139,250,.5); background: rgba(76,29,149,.3); color: #ddd6fe; }
  .hint { font-size: 12px; color: #a3a3a3; }
  .warn { color: #fca5a5; font-size: 12px; }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: #f4f4f5; color: #09090b; padding: 8px 14px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  input.small { width: 64px; }
  details summary { cursor: pointer; color: #a3a3a3; font-size: 12px; }

  /* search */
  .search { position: relative; flex: 1 1 220px; }
  .search input { width: 100%; }
  .results {
    position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 2px;
    background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; max-height: 300px; overflow: auto;
  }
  .results div { padding: 5px 8px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
  .results div:hover, .results div.hl { background: #27272a; }

  /* banner: where the rule hunt stands, and the suggested test */
  #banner { margin-top: 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
    border: 1px solid rgba(59,130,246,.45); background: linear-gradient(180deg, rgba(30,58,138,.28), rgba(30,58,138,.12)); border-radius: 12px; padding: 12px 14px; }
  #banner .lead { margin: 0; font-size: 13px; }
  #banner .next { margin-top: 4px; font-size: 15px; font-weight: 600; color: #dbeafe; }
  #banner details { margin-top: 4px; }
  @media (max-width: 700px) { #banner { grid-template-columns: 1fr; } }

  /* main layout */
  .layout { display: grid; grid-template-columns: 270px 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  #guns { position: sticky; top: 12px; display: grid; gap: 8px; }
  .gun { display: grid; gap: 3px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; background: #18181b; border: 1px solid #27272a; }
  .gun.on { border-color: #60a5fa; background: rgba(37,99,235,.14); }
  .gun .name { font-weight: 600; font-size: 13px; }
  .gun .marks { display: flex; gap: 10px; font-size: 11px; color: #a1a1aa; }
  .gun .find { font-size: 11px; color: #fde68a; }
  .mark-done { color: #6ee7b7; }
  .mark-todo { color: #fde68a; }
  .mark-missing { color: #52525b; }

  #bench { display: grid; gap: 16px; }
  .bench-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .gun-next { margin-top: 6px; font-size: 13px; color: #d4d4d8; }
  .variants { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-top: 12px; }
  .variant { display: grid; gap: 2px; text-align: left; padding: 10px; border-radius: 10px; background: #18181b; border: 1px solid #27272a; }
  .variant.on { border-color: #60a5fa; background: rgba(37,99,235,.14); box-shadow: 0 0 0 1px #60a5fa inset; }
  .variant.add { border-style: dashed; color: #a1a1aa; place-content: center; text-align: center; min-height: 92px; }
  .variant .v-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #a1a1aa; }
  .variant .v-label { font-weight: 600; font-size: 13px; }
  .variant .v-worth { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .variant .v-api { font-size: 11px; color: #a1a1aa; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  .two > div { min-width: 0; }
  .two .panel { overflow-x: auto; }

  .plan { display: grid; gap: 10px; }
  .step-label { font-weight: 600; font-size: 13px; }
  .recipe { display: grid; gap: 4px; padding: 10px; border-radius: 8px; background: #0f0f12; border: 1px solid #27272a; }
  .recipe .line { display: flex; justify-content: space-between; gap: 8px; }
  .outcomes { display: flex; gap: 6px; flex-wrap: wrap; }
  .outcome { border: 1px solid #3f3f46; border-radius: 8px; padding: 6px 10px; font-size: 12px; background: #18181b; cursor: pointer; text-align: left; min-width: 104px; }
  .outcome b { display: block; font-size: 15px; }
  .outcome:hover { border-color: #60a5fa; }
  .predict { font-size: 12px; display: grid; gap: 2px; }
  .predict .p-line { display: flex; justify-content: space-between; gap: 8px; }
  .finding { border-left: 2px solid #3f3f46; padding-left: 8px; font-size: 12px; margin-top: 8px; }
  .finding.good { border-color: rgba(52,211,153,.7); }
  .rules td:first-child { width: 34%; }
  table.compare td:first-child { white-space: nowrap; }
  table.found td:first-child { width: 45%; }
  tr.on td { background: rgba(59,130,246,.08); }

  .more > details { border-top: 1px solid #27272a; padding: 10px 0; }
  .more > details:first-child { border-top: none; padding-top: 0; }
  .more > details > summary { color: #e5e5e5; font-size: 14px; }
  .more > details > div { padding-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Base Value Lab <span class="badge-local">LOCAL</span></h1>
      <p class="sub">Pick a gun → measure it bare and with mods → put the suggested sacrifice in the circle → tap your timer → compare.</p>
    </div>
    <div class="row">
      <span id="skill"></span>
      <input type="file" id="import-file" accept="application/json" hidden />
    </div>
  </header>

  <section id="banner"></section>

  <div class="layout">
    <aside id="guns"></aside>
    <main id="bench"></main>
  </div>

  <section class="card more">
    <details id="d-rules"><summary>Possible explanations <span class="muted" id="c-rules"></span></summary><div id="rules"></div></details>
    <details><summary>Everything measured <span class="muted" id="c-found"></span></summary><div id="found"></div></details>
    <details><summary>My filler items <span class="muted" id="c-stash"></span></summary><div id="stash"></div></details>
    <details><summary>Test log <span class="muted" id="c-tests"></span></summary><div id="tests"></div></details>
    <details><summary>Settings, import and export</summary><div id="settings"></div></details>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import {
  MAX_HIDEOUT_SKILL, TIMERS, TIMER_RANGES, combineModes, emptyState, freeSlots, fillerTotal, mergeStates, parseState,
  planTest, solve, timerForTotal,
  checkControls, comparePair, doubtfulResults, fitRules,
  pickFillers, predictRange, subjectKey, suggestExperiment,
} from "./lab.js";

const STORE = "base-value-lab:v1";
const UNKNOWN_TYPES = ["gun", "preset", "armor", "armorPlate", "helmet", "keys"];
const OTHER = "other";
const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const rub = (v) => (v === Infinity ? "∞" : `₽${Math.round(v).toLocaleString("en-US")}`);
const k = (v) => (v === Infinity ? "∞" : v >= 1000 ? `${(v / 1000).toFixed(v >= 100_000 ? 0 : 1)}k` : String(Math.round(v)));
const uid = () => crypto.randomUUID().slice(0, 8);

// PvP and PvE give the same values, so everything lives in one mode. The
// stored mode only picks which item list (and shop prices) to use.
const mode = localStorage.getItem(`${STORE}:mode`) === "pvp" ? "pvp" : "pve";
let state = combineModes(load(), mode);
localStorage.setItem(STORE, JSON.stringify(state));
// The gun on the workbench (its bare item id, or OTHER) and the version picked on it.
let selectedGun = localStorage.getItem(`${STORE}:gun`) || null;
let selected = null;
// True while the build editor is open instead of the sacrifice card.
let drafting = false;
let draftBuild = { gun: null, mods: [] };
let items = { pvp: null, pve: null };
// Item id -> "Common" | "Rare" | "Superrare", from the community sheet. Unlisted = Not_exist.
let rarity = null;
let traderLevel = Number(localStorage.getItem(`${STORE}:trader`) || 4);
let buyFillers = localStorage.getItem(`${STORE}:buy`) !== "false";
// Hideout Management skill level, saved with each new test. Empty = not recorded.
const readSkill = (v) => (v === "" || v == null || !Number.isFinite(Number(v)) ? undefined : Math.min(MAX_HIDEOUT_SKILL, Math.max(0, Math.round(Number(v)))));
let hideoutSkill = readSkill(localStorage.getItem(`${STORE}:skill`));
const skillInput = () => `<label class="row muted" title="Hideout Management skill level (0-51). Saved with each test you record, since its bonus may change the result.">Hideout skill <input class="small" type="number" min="0" max="${MAX_HIDEOUT_SKILL}" placeholder="?" value="${hideoutSkill ?? ""}" data-action="skill" /></label>`;

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    return raw ? parseState(JSON.parse(raw)) : emptyState();
  } catch (err) {
    console.error(err);
    return emptyState();
  }
}
function save() {
  localStorage.setItem(STORE, JSON.stringify(state));
  render();
}
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (el.hidden = true), 2600);
}

async function loadRarity() {
  if (rarity) return rarity;
  const res = await fetch("rarity.json");
  if (!res.ok) throw new Error("rarity.json missing");
  const data = await res.json();
  rarity = new Map();
  for (const tier of ["Common", "Rare", "Superrare"]) for (const id of data[tier] ?? []) rarity.set(id, tier);
  return rarity;
}
const isRare = (id) => { const t = rarity?.get(id); return t === "Rare" || t === "Superrare"; };

async function loadItems(m) {
  if (items[m]) return items[m];
  const res = await fetch(`items-${m}.json`);
  if (!res.ok) throw new Error(`items-${m}.json missing: run bun run lab`);
  const data = await res.json();
  const byId = new Map(data.items.map((it) => [it.id, it]));
  const byName = new Map(data.items.map((it) => [it.name.toLowerCase(), it]));
  // Presets grouped by the gun they're built on.
  const presets = new Map();
  for (const it of data.items) {
    if (!it.types.includes("preset") || !it.baseItem) continue;
    if (!presets.has(it.baseItem)) presets.set(it.baseItem, []);
    presets.get(it.baseItem).push(it);
  }
  items[m] = { list: data.items, byId, byName, presets, fetchedAt: data.fetchedAt };
  return items[m];
}

const subjectsFor = () => state.subjects.filter((s) => s.mode === mode);
const testsFor = () => state.tests.filter((t) => t.mode === mode);
const subjectById = (id) => state.subjects.find((s) => s.id === id);

function kindFor(item) {
  const t = item.types;
  if (t.includes("preset")) return "weapon";
  if (t.includes("gun")) return "weapon-bare";
  if (t.includes("keys")) return "key";
  if (t.includes("armor") || t.includes("armorPlate") || t.includes("helmet")) return "armour";
  return "other";
}
const STATUS_LABEL = {
  untested: "Not tested", open: "Narrowing", "needs-confirmation": "Needs 2nd check",
  confident: "Done", "too-high": "Above 350k", conflict: "Conflict",
};

function condition(s) {
  const bits = [];
  if (s.durability !== undefined && s.durability < 100) bits.push(`${s.durability}% dur`);
  if (s.uses !== undefined) bits.push(`${s.uses} uses`);
  return bits.join(", ");
}

// Cheapest trader offer the chosen loyalty level unlocks, or null.
function traderPrice(it) {
  const prices = (it.trader ?? [])
    .filter((o) => o.level <= traderLevel)
    .map((o) => o.price);
  return prices.length ? Math.min(...prices) : null;
}

// Built once per render: it scans the whole item list, which is not cheap.
let cachedFillers = null;
function fillerOptions() {
  if (cachedFillers) return cachedFillers;
  const opts = state.stash[mode].map((st) => ({
    itemId: st.itemId, name: st.name, baseValue: st.baseValue, cost: 0, available: st.count, owned: true,
  }));
  const data = items[mode];
  if (!buyFillers || !data) return (cachedFillers = opts);
  const priced = [];
  for (const it of data.list) {
    if (!it.basePrice || it.types.some((t) => UNKNOWN_TYPES.includes(t))) continue;
    const prices = [];
    if (it.flea && !it.types.includes("noFlea")) prices.push(it.flea);
    const trader = traderPrice(it);
    if (trader !== null) prices.push(trader);
    if (!prices.length) continue;
    priced.push({ it, cost: Math.min(...prices) });
  }
  // Best value per rouble overall, plus the best per value band so any gap can be filled.
  priced.sort((a, b) => a.cost / a.it.basePrice - b.cost / b.it.basePrice);
  const pick = new Map(priced.slice(0, 30).map((p) => [p.it.id, p]));
  for (let lo = 200; lo < 400_000; lo *= 1.6) {
    const band = priced.filter((p) => p.it.basePrice >= lo && p.it.basePrice < lo * 1.6).slice(0, 2);
    for (const p of band) pick.set(p.it.id, p);
  }
  for (const { it, cost } of pick.values()) {
    if (opts.some((o) => o.itemId === it.id)) continue;
    opts.push({ itemId: it.id, name: it.name, baseValue: it.basePrice, cost, available: state.settings.maxItems, owned: false });
  }
  return (cachedFillers = opts);
}

// Extra copies of the item under test have to be bought too.
function copyCost(subject) {
  const it = subject.itemId && items[mode]?.byId.get(subject.itemId);
  if (!it) return 50_000;
  const prices = [it.flea, traderPrice(it)].filter(Boolean);
  return prices.length ? Math.min(...prices) : 50_000;
}

// ---------- what an item is made of ----------

const ratioText = (r) => `×${r.lo.toFixed(2)}–${r.hi === Infinity ? "∞" : r.hi.toFixed(2)}`;
const rangeText = (r) => `${k(r.lo)} – ${k(r.hi)}`;
const isWeapon = (s) => s.kind === "weapon" || s.kind === "weapon-bare";
const atFull = (s) => s.kind === "key" || s.durability === undefined || s.durability >= 100;
const measured = (r) => r && r.testCount > 0 && r.status !== "conflict";
// "HK MP5 9x19 submachine gun (Navy 3 Round Burst) Default" -> "HK MP5 (Navy 3 Round Burst) Default"
const short = (name) => name.replace(/ \.?\d+(\.\d+)?x\d+\w*/, "").replace(/ (submachine gun|assault rifle|machine pistol|pistol|carbine|shotgun|sniper rifle|marksman rifle|bolt-action rifle|light machine gun)\b/, "");

// What the API says the item is made of: gun body plus attached mods.
// "rare" is the API value of the parts the community sheet tags Rare/Superrare.
function compositionFor(s) {
  const rareOf = (id, value) => (rarity && id && isRare(id) ? value : 0);
  if (s.build) {
    const mods = s.build.mods;
    return {
      gun: s.build.gunValue,
      mods: mods.reduce((sum, m) => sum + m.baseValue * m.count, 0),
      modCount: mods.reduce((n, m) => n + m.count, 0),
      rare: rarity ? rareOf(s.itemId, s.build.gunValue) + mods.reduce((sum, m) => sum + rareOf(m.itemId, m.baseValue * m.count), 0) : undefined,
    };
  }
  const data = items[s.mode];
  const it = data && (s.itemId ? data.byId.get(s.itemId) : data.byName.get(s.name.toLowerCase()));
  if (!it) return s.apiBaseValue ? { gun: s.apiBaseValue, mods: 0, modCount: 0 } : null;
  return compositionOfItem(it);
}
function compositionOfItem(it) {
  const data = items[mode];
  const rareOf = (id, value) => (rarity && id && isRare(id) ? value : 0);
  if (!it.parts) return { gun: it.basePrice, mods: 0, modCount: 0, rare: rarity ? rareOf(it.id, it.basePrice) : undefined };
  const comp = { gun: 0, mods: 0, modCount: 0, rare: rarity ? 0 : undefined };
  for (const p of it.parts) {
    const part = data?.byId.get(p.id);
    if (!part) continue;
    if (part.types.includes("gun")) comp.gun += part.basePrice * p.count;
    else { comp.mods += part.basePrice * p.count; comp.modCount += p.count; }
    if (rarity) comp.rare += rareOf(p.id, part.basePrice * p.count);
  }
  return comp;
}
const apiOf = (s) => { const c = compositionFor(s); return c ? c.gun + c.mods : s.apiBaseValue; };

// The bare gun a preset or build is built on.
function bareItemId(s) {
  if (s.kind === "weapon-bare" || s.build) return s.itemId;
  return s.itemId ? items[s.mode]?.byId.get(s.itemId)?.baseItem : undefined;
}
const gunKeyOf = (s) => (isWeapon(s) ? bareItemId(s) ?? `sub:${s.id}` : OTHER);

function observations(res, filter) {
  return subjectsFor().flatMap((s) => {
    const r = res.get(s.id);
    const comp = filter(s) && atFull(s) && measured(r) ? compositionFor(s) : null;
    return comp && comp.gun + comp.mods > 0 ? [{ id: s.id, name: s.name, range: r.range, comp }] : [];
  });
}

// Short names for a gun's versions: "Bare", "Default", "PK-120 + 3 more".
function variantLabel(s) {
  if (s.kind === "weapon-bare") return "Bare gun";
  if (s.build) {
    const mods = [...s.build.mods].sort((a, b) => b.baseValue * b.count - a.baseValue * a.count);
    const names = mods.map((m) => items[mode]?.byId.get(m.itemId)?.shortName ?? m.name);
    return names.length > 2 ? `${names[0]} + ${names.length - 1} more` : names.join(" + ");
  }
  const it = s.itemId && items[mode]?.byId.get(s.itemId);
  const gun = it?.baseItem && items[mode].byId.get(it.baseItem);
  const label = gun && it.name.startsWith(gun.name) ? it.name.slice(gun.name.length).trim() : "";
  return label || (it?.shortName ?? short(s.name));
}
const variantKind = (s) => (s.kind === "weapon-bare" ? "No mods" : s.build ? "Your build" : s.kind === "weapon" ? "Preset" : s.kind);

// ---------- rendering ----------

let ctx = null;
let currentPlan = null;
let bannerTarget = null;
let controlPlans = [];

function controlPlan(target, expect) {
  const pick = pickFillers(fillerOptions(), target, 250, state.settings.maxItems);
  return pick && pick.picks.length ? { expect, ...pick } : null;
}

function render() {
  cachedFillers = null;
  const res = solve(subjectsFor(), testsFor(), state.settings);
  const weaponObs = observations(res, isWeapon);
  const fits = fitRules(weaponObs, { weapons: true });
  const alive = fits.filter((f) => f.verdict === "fits");
  const lastTested = new Map();
  for (const t of testsFor()) for (const e of t.entries) if (!t.excluded && t.timer && (lastTested.get(e.subjectId) ?? "") < t.createdAt) lastTested.set(e.subjectId, t.createdAt);
  ctx = { res, weaponObs, fits, alive, lastTested, groups: gunGroups(res, lastTested) };

  renderBanner();
  // Keep the workbench on a gun that exists.
  if (!selectedGun || !ctx.groups.has(selectedGun)) {
    const target = bannerTarget?.subjectId && subjectById(bannerTarget.subjectId);
    selectedGun = target ? gunKeyOf(target) : ctx.groups.keys().next().value ?? null;
    selected = target?.id ?? null;
  }
  const g = ctx.groups.get(selectedGun);
  if (g && (!selected || !g.subjects.some((s) => s.id === selected))) selected = nextForGun(g).subjectId ?? g.subjects[0]?.id ?? null;
  if (selectedGun) localStorage.setItem(`${STORE}:gun`, selectedGun);

  renderGuns();
  renderBench();
  renderRules();
  renderFound();
  renderStash();
  renderSettings();
  renderTests();
  $("#skill").innerHTML = skillInput();
  $("#c-stash").textContent = `(${state.stash[mode].length})`;
  $("#c-tests").textContent = `(${testsFor().length})`;
}

// Weapons grouped by the bare gun they're built on; armour, keys etc. in one extra group.
function gunGroups(res, lastTested) {
  const map = new Map();
  for (const s of subjectsFor()) {
    const key = gunKeyOf(s);
    if (!map.has(key)) map.set(key, { key, subjects: [] });
    map.get(key).subjects.push(s);
  }
  for (const g of map.values()) {
    g.item = items[mode]?.byId.get(g.key);
    g.name = g.key === OTHER ? "Armour, keys and other" : short(g.item?.name ?? g.subjects[0].name);
    g.bare = g.subjects.find((s) => s.kind === "weapon-bare" && atFull(s));
    g.modded = g.subjects.filter((s) => s.kind === "weapon");
    g.last = g.subjects.reduce((m, s) => ((lastTested.get(s.id) ?? "") > m ? lastTested.get(s.id) : m), "");
    // Bare vs each modded version, once both are measured.
    const rb = g.bare && res.get(g.bare.id);
    g.pairs = measured(rb) ? g.modded.flatMap((s) => {
      const r = res.get(s.id);
      const comp = compositionFor(s);
      return measured(r) && comp && atFull(s) ? [{ s, cmp: comparePair(rb.range, r.range, comp) }] : [];
    }) : [];
  }
  // Untested guns first (you just added them), then most recently tested.
  return new Map([...map.values()]
    .sort((a, b) => (a.key === OTHER) - (b.key === OTHER) || (b.last || "~").localeCompare(a.last || "~"))
    .map((g) => [g.key, g]));
}

// The next thing to do on one gun.
function nextForGun(g) {
  const { res } = ctx;
  const open = (s) => !["confident", "too-high"].includes(res.get(s.id)?.status);
  if (g.key === OTHER) {
    const s = g.subjects.find(open);
    return s ? { text: `Test ${esc(s.name)}.`, subjectId: s.id } : { text: "All measured." };
  }
  if (!g.bare) return { text: "Add the bare gun (no mods) and measure it first.", addItem: g.item?.id };
  if (!measured(res.get(g.bare.id))) return { text: "Measure the bare gun: put the sacrifice below in the circle.", subjectId: g.bare.id };
  if (!g.modded.length) return { text: "Now measure it with mods: add a preset or build your own.", build: true };
  const untested = g.modded.find((s) => !measured(res.get(s.id)));
  if (untested) return { text: `Measure ${esc(variantLabel(untested))}.`, subjectId: untested.id };
  const unclear = g.pairs.find((p) => p.cmp.finding === "unclear" && open(p.s));
  if (unclear) return { text: `Narrow ${esc(variantLabel(unclear.s))} down further, so the comparison is clear.`, subjectId: unclear.s.id };
  const firm = [g.bare, ...g.modded].find((s) => res.get(s.id)?.status === "needs-confirmation");
  if (firm) return { text: `Double-check ${esc(variantLabel(firm))}: one more test makes its result solid.`, subjectId: firm.id };
  if (!g.modded.some((s) => s.build)) return { text: "Try your own build: one expensive mod (10k+) shows what attaching does.", build: true };
  return { text: "This gun is done for now. Build another version, or pick the next gun." };
}

function renderBanner() {
  const { res, weaponObs, fits, alive } = ctx;
  const data = items[mode];
  const subs = subjectsFor();
  const testCount = (id) => res.get(id)?.testCount ?? 0;
  const doubtful = doubtfulResults(fits, testCount);
  const failedControls = checkControls(testsFor()).filter((c) => !c.ok);

  let summary;
  if (!weaponObs.length) summary = "No weapons measured yet. Add a gun on the left to start.";
  else if (fits[0].verdict === "fits") summary = "So far every gun is worth its API value.";
  else if (alive.length > 1) summary = `The API value is wrong for some guns. <b>${alive.length} explanations</b> still fit.`;
  else if (alive.length === 1) summary = `One explanation fits all ${weaponObs.length} results: <b>${esc(alive[0].title)}</b>${alive[0].fitted && alive[0].informative ? ` (${paramText(alive[0])})` : ""}.`;
  else summary = `No single explanation fits all ${weaponObs.length} results. A result may be wrong, or each gun has its own hidden value.`;

  // Bare guns we have a modded version of but haven't measured bare.
  const missingBare = [...ctx.groups.values()].filter((g) => g.key !== OTHER && !g.bare && g.item && g.modded.some((s) => measured(res.get(s.id))));
  const suggestion = suggestExperiment(fits, [
    ...subs.filter((s) => isWeapon(s) && atFull(s)).flatMap((s) => {
      const comp = compositionFor(s);
      const r = res.get(s.id);
      return comp && r?.status !== "conflict" && r?.status !== "too-high" ? [{ id: s.id, name: s.name, comp, range: r.range }] : [];
    }),
    ...missingBare.map((g) => ({ id: `add:${g.item.id}`, name: g.item.name, comp: { gun: g.item.basePrice, mods: 0, modCount: 0 }, range: { lo: 0, hi: Infinity } })),
  ], state.settings.tolerance);

  let next = null;
  if (failedControls.length) {
    controlPlans = data ? [controlPlan(10_350, "3h"), controlPlan(9_650, "2h")] : [];
    const html = controlPlans.map((p, i) => p ? `<div class="recipe" style="margin-top:6px"><div>${p.picks.map((x) => `${x.qty}× ${esc(x.option.name)}`).join(", ")} = <b>${rub(p.total)}</b>, expect <b>${p.expect}</b></div>
      <div class="row">Got: ${TIMERS.slice(0, 4).map((t) => `<button class="timer" data-action="control" data-i="${i}" data-timer="${t}">${t}</button>`).join("")}</div></div>` : "").join("");
    next = { title: "Re-run a control test", why: `A test of only known items gave the wrong timer, so the timer edges are in doubt.${html}` };
  } else if (doubtful.length) {
    const d = doubtful[0];
    next = { title: `Test ${esc(short(d.name))} again`, why: `Only one test backs this result, and it alone rules out ${d.breaks} explanations. A second test catches a misread timer.`, subjectId: d.id };
  } else if (suggestion) {
    const c = suggestion.candidate;
    const guesses = suggestion.guesses.slice(0, 4).map((g) => `<li>${esc(g.rule.title)}: about <b>${k(g.value)}</b></li>`).join("");
    const why = `The explanations still possible disagree on what it's worth:<ul style="margin:4px 0">${guesses}</ul>Any timer you get rules at least one out.`;
    next = c.id.startsWith("add:")
      ? { title: `Measure the bare ${esc(short(c.name))}`, why, addItem: c.id.slice(4) }
      : { title: `Test ${esc(short(c.name))}`, why, subjectId: c.id };
  } else if (weaponObs.length) {
    next = { title: "Pick the next gun", why: "Nothing measured so far splits the explanations. A new gun, measured bare and with mods, adds evidence." };
  }
  bannerTarget = next;
  const go = next?.subjectId || next?.addItem ? `<button class="primary" data-action="banner-go">Go to it</button>` : "";
  $("#banner").innerHTML = `
    <div>
      <p class="lead">${summary} ${fits.length && weaponObs.length ? `<button class="link" data-action="show-rules">See all explanations</button>` : ""}</p>
      ${next ? `<div class="next">Suggested next: ${next.title}</div>${next.why ? `<details><summary>Why this?</summary><div class="hint" style="margin-top:4px">${next.why}</div></details>` : ""}` : ""}
    </div>
    <div>${go}</div>`;
  $("#c-rules").textContent = weaponObs.length ? `(${alive.length} of ${fits.length} left)` : "";
}

function renderGuns() {
  const { res } = ctx;
  const mark = (state, label) => `<span class="mark-${state}">${state === "done" ? "✓" : state === "todo" ? "●" : "○"} ${label}</span>`;
  const rows = [...ctx.groups.values()].map((g) => {
    let marks = "";
    let find = "";
    if (g.key === OTHER) marks = `<span>${g.subjects.length} item${g.subjects.length > 1 ? "s" : ""}</span>`;
    else {
      const bare = !g.bare ? "missing" : measured(res.get(g.bare.id)) ? "done" : "todo";
      const mods = !g.modded.length ? "missing" : g.modded.every((s) => measured(res.get(s.id))) ? "done" : "todo";
      marks = mark(bare, "Bare") + mark(mods, `With mods${g.modded.length > 1 ? ` (${g.modded.length})` : ""}`);
      const best = g.pairs.find((p) => p.cmp.finding !== "unclear") ?? g.pairs[0];
      if (best) find = `Mods count ${ratioText(best.cmp.modsRatio)}`;
    }
    return `<button class="gun ${g.key === selectedGun ? "on" : ""}" data-action="pick-gun" data-gun="${esc(g.key)}">
      <span class="name">${esc(g.name)}</span><span class="marks">${marks}</span>${find ? `<span class="find">${find}</span>` : ""}</button>`;
  }).join("");
  $("#guns").innerHTML = `
    <h2>Guns</h2>
    <div class="row"><div class="search" id="gun-search"></div></div>
    ${rows || '<p class="hint">Search for a gun or a preset (like "TOZ-106 Default") to add it.</p>'}`;
  mountSearch($("#gun-search"), "Add a gun or preset…", (it) => it.types.includes("gun") || (it.types.includes("preset") && it.baseItem), addWeapon);
}

function renderBench() {
  const el = $("#bench");

      ...g.subjects.filter((s) => s !== g.bare).map(card),
      ...presets.map((p) => `<button class="variant add" data-action="add-item" data-item="${esc(p.id)}">+ ${esc(variantLabel({ kind: "weapon", itemId: p.id, name: p.name }))}<br><span class="muted">preset, API ${k(p.basePrice)}</span></button>`),
      `<button class="variant add ${drafting ? "on" : ""}" data-action="build-new">+ Build your own</button>`,
    ].join("");
  }

    : next.addItem ? ` <button class="link" data-action="add-item" data-item="${esc(next.addItem)}">Add it</button>`
    : next.build && !drafting ? ` <button class="link" data-action="build-new">Build one</button>` : "";

      <div class="variants">${cards}</div>

  if (drafting && g.item) mountBuildSearch(g);
  if (g.key === OTHER) mountSearch($("#other-search"), "Add armour, key or other item…", (it) => it.types.some((t) => UNKNOWN_TYPES.includes(t)) && !it.types.includes("gun") && !it.types.includes("preset"), (it) => { addSubject(it); render(); });
}

// What each explanation still standing says an item is worth.
function predictionsHtml(comp, plan) {
  const list = ctx.alive.filter((f) => !f.param || f.informative).slice(0, 4);
  if (!comp || !list.length) return "";
  const qty = plan?.qty ?? 1;
  const extra = plan?.fillerTotal ?? 0;
  const lines = list.map((f) => {
    const r = predictRange(f, comp);
    const lo = timerForTotal(qty * r.lo + extra);
    const hi = r.hi === Infinity ? "14h" : timerForTotal(qty * r.hi + extra);
    return `<div class="p-line"><span>${esc(f.title)}${f.fitted && f.informative ? ` <span class="muted">${paramText(f)}</span>` : ""}</span><span><b>${rangeText(r)}</b>${plan || !extra ? ` → ${lo === hi ? lo : `${lo}–${hi}`}` : ""}</span></div>`;
  }).join("");
  return `<div class="predict"><div class="muted">${plan ? "What each explanation expects from this sacrifice:" : "What each explanation says it's worth:"}</div>${lines}</div>`;
}

function sacrificeHtml(subject) {
  const r = ctx.res.get(subject.id);
  const del = `<button class="link" style="color:#fca5a5" data-action="del-subject" data-id="${esc(subject.id)}">Remove this version</button>`;
  return `<div class="panel">
    <h2>Sacrifice</h2>
    <div style="font-weight:600;margin-bottom:8px">${esc(subject.name)}</div>
    ${planHtml(subject, r)}
    ${logHtml(subject)}
    <div style="margin-top:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap" class="hint">
      <span>${r.testCount} test${r.testCount === 1 ? "" : "s"} so far. Copies you own <input class="small" type="number" min="1" max="20" value="${subject.owned ?? 1}" data-action="owned" data-id="${esc(subject.id)}" /></span>
      ${del}
    </div>
  </div>`;
}

// The recipe for testing one item, with a button per possible timer.
function planHtml(subject, r) {
  currentPlan = null;
  const comp = isWeapon(subject) ? compositionFor(subject) : null;
  if (r?.status === "confident") return `<p>Done: worth <b>${rub(r.confirmed.lo)} – ${rub(r.confirmed.hi)}</b> (each edge backed by two tests).</p>${predictionsHtml(comp)}`;
  if (r?.status === "conflict") return `<p class="warn">The tests on this item disagree. Exclude or fix the highlighted test${r.suspects.length > 1 ? "s" : ""} in the test log below.</p>`;
  if (r?.status === "too-high") return `<p>One copy is already above ${rub(350_000)}, where every timer looks the same, so it can't be narrowed further. Best known: <b>${rub(r.range.lo)}+</b>.</p>`;
  const plan = planTest({ subject, result: r, fillers: fillerOptions(), settings: state.settings, copyCost: copyCost(subject) });
  currentPlan = plan;
  if (!plan) return `<p class="warn">No test fits. Add fillers to your stash, allow buying, raise the item limit, or set how many copies you own.</p>`;
  const goal = {
    narrow: `Checks whether it's worth more than <b>${rub(plan.splitAt)}</b>.`,
    "confirm-low": `Second check that it's worth more than <b>${rub(plan.splitAt)}</b>.`,
    "confirm-high": `Second check that it's worth at most <b>${rub(plan.splitAt)}</b>.`,
  }[plan.goal];
  // 6h is the rare bonus roll, not a value band: it lives under "different timer".
  const likely = plan.outcomes.map((o) => o.timer).filter((t) => t !== "6h");
  return `
    <div class="plan">
      <div class="step-label">1. Put these in the circle together</div>
      <div class="recipe">
        <div class="line"><span><b>${plan.qty}×</b> ${esc(subject.name)} <span class="muted">${esc(condition(subject))}</span></span><span class="muted">testing this</span></div>
        ${plan.fillers.map((f) => `<div class="line"><span><b>${f.qty}×</b> ${esc(f.name)} ${f.owned ? '<span class="pill">yours</span>' : `<span class="pill">buy, ${rub(f.cost)} each</span>`}</span><span class="num">${rub(f.baseValue * f.qty)}</span></div>`).join("")}
        ${plan.fillers.length ? "" : '<div class="muted">Nothing else, just the item.</div>'}
      </div>
      <div class="hint">${goal} Known so far: ${rub(r?.range.lo ?? 0)} – ${rub(r?.range.hi ?? Infinity)}.</div>
      ${predictionsHtml(comp, plan)}
      <div class="step-label">2. Tap the timer you got</div>
      <div class="outcomes">
        ${TIMERS.filter((t) => likely.includes(t)).map((t) => {
          const o = plan.outcomes.find((x) => x.timer === t);
          return `<button class="outcome" data-action="record" data-timer="${t}"><b>${t}</b>worth ${k(o.implies.lo)} – ${k(o.implies.hi)}</button>`;
        }).join("")}
      </div>
    </div>`;
}

// Log any sacrifice of this item, e.g. 5 copies on their own. Each timer
// shows what it would mean for one copy.
function logHtml(subject) {
  const plan = currentPlan?.subjectId === subject.id ? currentPlan : null;
  const qty = plan?.qty ?? 1;
  const fill = plan?.fillerTotal ?? 0;
  return `<div class="plan log" style="margin-top:12px">
    <div class="step-label">Log a test you ran</div>
    <div class="hint" style="margin-bottom:6px">Any number of copies, with or without other items. Other items are counted at their API value.</div>
    <div class="row">
      <label class="row muted">Copies <input class="small" id="log-qty" type="number" min="1" max="50" value="${qty}" /></label>
      <label class="row muted">Other items worth ₽ <input id="log-fill" type="number" min="0" value="${fill}" style="width:110px" /></label>
    </div>
    <div class="outcomes" style="margin-top:8px">
      ${TIMERS.map((t) => `<button class="outcome" data-action="log" data-id="${esc(subject.id)}" data-timer="${t}"><b>${t}</b><span data-implies="${t}">${impliesText(t, qty, fill)}</span></button>`).join("")}
    </div>
  </div>`;
}
function logInputs() {
  return {
    qty: Math.max(1, Math.floor(Number($("#log-qty")?.value) || 1)),
    fill: Math.max(0, Number($("#log-fill")?.value) || 0),
  };
}
// What a timer says about one copy, given the copies and other items.
function impliesText(timer, qty, fill) {
  const [lo, hi] = TIMER_RANGES[timer];
  const each = (v) => (v === Infinity ? Infinity : Math.max(0, (v - fill) / qty));
  if (hi !== Infinity && hi < fill) return "not possible";
  const label = qty > 1 ? "each" : "worth";
  return hi === Infinity ? `${label} ≥ ${k(each(lo))}` : `${label} ${k(each(lo))} – ${k(each(hi))}`;
}

// Bare gun vs every modded version of it.
function compareHtml(g) {
  const { res, alive } = ctx;
  const rb = g.bare && res.get(g.bare.id);
  const bareKnown = measured(rb);
  const rule = alive.length === 1 && (!alive[0].param || alive[0].informative) ? alive[0] : null;
  const rows = [g.bare, ...g.modded].filter(Boolean).map((s) => {
    const r = res.get(s.id);
    const comp = compositionFor(s);
    const api = comp ? comp.gun + comp.mods : s.apiBaseValue;
    const pair = g.pairs.find((p) => p.s === s);
    const vsApi = measured(r) && api ? `×${(r.range.lo / api).toFixed(2)}–${r.range.hi === Infinity ? "∞" : (r.range.hi / api).toFixed(2)}` : "";
    const modsAdd = pair ? `${rangeText(pair.cmp.modsValue)} <span class="muted">${ratioText(pair.cmp.modsRatio)}</span>` : s === g.bare ? '<span class="muted">—</span>' : "";
    const said = rule && comp ? rangeText(predictRange(rule, comp)) : "";
    return `<tr class="${s.id === selected && !drafting ? "on" : ""}">
      <td><button class="link" data-action="pick" data-id="${esc(s.id)}">${esc(variantLabel(s))}</button>${comp?.mods ? `<div class="muted">mods ${k(comp.mods)} loose</div>` : ""}</td>
      <td class="num">${api ? k(api) : "?"}</td>
      <td class="num">${measured(r) ? `<b>${rangeText(r.range)}</b>` : '<span class="muted">—</span>'}</td>
      <td class="num">${vsApi}</td>
      <td class="num">${modsAdd}</td>
      ${rule ? `<td class="num muted">${said}</td>` : ""}
    </tr>`;
  }).join("");
  const findings = g.pairs.map((p) => {
    const [cls, text] = pairText(p.cmp);
    return `<div class="finding ${cls}"><b>${esc(variantLabel(p.s))}</b>: ${text}</div>`;
  }).join("");
  const help = !g.bare || !bareKnown ? `<div class="hint" style="margin-top:8px">Measure the bare gun to see what the mods add.</div>`
    : !g.modded.length ? `<div class="hint" style="margin-top:8px">Add a preset or your own build to compare against.</div>` : "";
  return `<div class="panel">
    <h2>Compare</h2>
    <table class="compare">
      <thead><tr><th>Version</th><th class="num">API</th><th class="num">Measured</th><th class="num">vs API</th><th class="num" title="Measured worth minus the bare gun's, and how that compares with the mods' loose API value">Mods add</th>${rule ? `<th class="num" title="${esc(rule.title)}">Rule says</th>` : ""}</tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="muted">Nothing here yet.</td></tr>'}</tbody>
    </table>
    ${findings}${help}
    <div class="muted" style="font-size:11px;margin-top:8px">× compares measured worth with the API value. "Mods add" is the modded version minus the bare gun; its × compares that with the mods' loose API value.</div>
  </div>`;
}

function pairText(cmp) {
  const body = ratioText(cmp.gunRatio);
  const mods = `${rangeText(cmp.modsValue)} (${ratioText(cmp.modsRatio)} their loose value)`;
  return {
    "mods-extra": [`good`, `The bare gun is worth its API value (${body}). The mods add ${mods}. <b>Attached mods count extra.</b>`],
    "gun-extra": [`good`, `The gun body is worth more than its API value (${body}); the mods add about their loose value (${mods}). <b>The hidden value is in the gun.</b>`],
    "both-extra": [`good`, `Both count extra: gun body ${body}, mods add ${mods}.`],
    "matches-api": [`good`, `Both match the API: body ${body}, mods ${mods}. <b>This gun is valued normally.</b>`],
    unclear: [``, `Not precise enough yet: body ${body}, mods add ${mods}. Narrow both down.`],
  }[cmp.finding];
}

function otherHtml() {
  return `<div class="panel">
    <h2>Add an item</h2>

// ---------- secondary panels ----------

function paramText(f) {
  const r = f.fitted;
  if (!r) return "";
  if (f.param.unit === "x") return ratioText(r);
  return `${r.lo === -Infinity ? "−∞" : rub(r.lo)} – ${rub(r.hi)}`;
}

function renderRules() {
  const { fits, weaponObs } = ctx;
  if (!weaponObs.length) { $("#rules").innerHTML = '<p class="hint">Measure a weapon first.</p>'; return; }
  const bounded = (f) => f.fitted && (f.fitted.lo > 0 || f.fitted.hi < Infinity);
  const rows = fits.map((f) => {
    const pill = { fits: '<span class="pill st-confident">possible</span>', "ruled-out": '<span class="pill st-conflict">ruled out</span>', untested: '<span class="pill">no data</span>' }[f.verdict];
    let detail = "";
    if (f.verdict === "fits") {
      detail = f.param ? (f.informative ? `${f.param.label}: <b>${paramText(f)}</b>` : `Can't pin the ${f.param.label} yet.`) : `Matches all ${f.checked}.`;
    } else if (f.verdict === "ruled-out") {
      const ok = f.checked - f.offenders.length;
      const list = f.offenders.slice(0, 2).map((o) => `${esc(short(o.name))} (worth ${k(o.measured.lo)}–${k(o.measured.hi)}, rule says ${k(o.predicted)})`).join("; ");
      const best = !f.param ? "" : bounded(f) ? `Best ${f.param.label} ${paramText(f)} fits ${ok} of ${f.checked}. ` : f.id === "rare" ? "None of these items have parts tagged Rare, so this rule says they're worth their API value. " : "";
      detail = `${best}Broken by ${list}${f.offenders.length > 2 ? ` and ${f.offenders.length - 2} more` : ""}.`;
    }
    return `<tr><td><b>${esc(f.title)}</b><div class="muted">${esc(f.idea)}</div></td><td>${pill}</td><td>${detail}</td></tr>`;
  }).join("");
  const skilled = testsFor().filter((t) => !t.excluded && t.timer && t.hideoutSkill > 0);
  $("#rules").innerHTML = `
    <p class="hint" style="margin-top:0">The circle adds up a hidden value for everything you sacrifice and picks the timer from the total. Each explanation below is a guess at how a gun's hidden value is built from its API values; every measurement rules some out.</p>
    <table class="rules"><thead><tr><th>Explanation</th><th>Status</th><th>Why</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="muted" style="font-size:11px;margin-top:4px">Checked against ${weaponObs.length} weapon result(s) at full durability.${rarity ? " Rarity tags come from the community sheet and may have mistakes." : ""}${skilled.length ? ` ${skilled.length} test(s) were run with Hideout Management skill above 0; tick "exclude" on them in the test log to see if skill matters.` : ""}</div>`;
}

function renderFound() {
  const { res, lastTested } = ctx;
  const x = (ratio) => ratio.toFixed(ratio < 1.1 ? 2 : 1);
  const subs = subjectsFor().filter((s) => measured(res.get(s.id)))
    .sort((a, b) => (lastTested.get(b.id) ?? "").localeCompare(lastTested.get(a.id) ?? ""));
  $("#c-found").textContent = `(${subs.length})`;
  const rows = subs.map((s) => {
    const r = res.get(s.id);
    const api = apiOf(s);
    const { lo, hi } = r.range;
    let verdict = "";
    if (api && lo > api) verdict = `<span class="pill st-needs-confirmation">more than API</span> <span class="muted">×${x(lo / api)}–${hi === Infinity ? "∞" : x(hi / api)}</span>`;
    else if (api && hi < api) verdict = `<span class="pill st-conflict">less than API</span>`;
    else if (api) verdict = `<span class="pill st-confident">API fits</span>`;
    return `<tr><td><button class="link" data-action="pick" data-id="${esc(s.id)}">${esc(s.name)}</button>${condition(s) ? ` <span class="muted">${esc(condition(s))}</span>` : ""}</td><td class="num">${k(lo)} – ${k(hi)}</td><td class="num muted">${api ? k(api) : "?"}</td><td>${verdict}</td><td class="num muted">${r.testCount}</td></tr>`;
  }).join("");
  $("#found").innerHTML = subs.length
    ? `<table class="found"><thead><tr><th>Item</th><th class="num">Worth</th><th class="num">API</th><th></th><th class="num">Tests</th></tr></thead><tbody>${rows}</tbody></table>`
    : '<p class="hint">Nothing measured yet.</p>';
}

// ---------- search ----------

// opts.browse: list the most valuable matches before anything is typed.
// opts.note(it): extra text shown next to a result.
function mountSearch(host, placeholder, filter, onPick, opts = {}) {
  if (!host) return;
  host.innerHTML = `<input placeholder="${esc(placeholder)}" /><div class="results" hidden></div>`;
  const input = host.querySelector("input");
  const box = host.querySelector(".results");
  let matches = [];
  const show = () => {
    const q = input.value.trim().toLowerCase();
    const data = items[mode];
    if ((!q && !opts.browse) || !data) { box.hidden = true; return; }
    const words = q ? q.split(/\s+/) : [];
    matches = data.list.filter((it) => filter(it) && words.every((w) => it.name.toLowerCase().includes(w) || it.shortName.toLowerCase().includes(w)));
    if (!q) matches.sort((a, b) => b.basePrice - a.basePrice);
    matches = matches.slice(0, 15);
    box.innerHTML = matches.map((it, i) => `<div data-i="${i}" class="${i === 0 ? "hl" : ""}"><span>${esc(it.name)}${opts.note ? ` <span class="muted">${esc(opts.note(it))}</span>` : ""}</span><span class="muted">${rub(it.basePrice)}</span></div>`).join("") || `<div class="muted">${opts.empty ?? "No match"}</div>`;
    box.hidden = false;
  };
  input.addEventListener("input", show);
  if (opts.browse) input.addEventListener("focus", show);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && matches[0]) { onPick(matches[0]); input.value = ""; box.hidden = true; }
    if (e.key === "Escape") box.hidden = true;
  });
  box.addEventListener("mousedown", (e) => {
    const row = e.target.closest("[data-i]");
    if (!row) return;
    e.preventDefault();
    onPick(matches[Number(row.dataset.i)]);
    input.value = "";
    box.hidden = true;
  });
  input.addEventListener("blur", () => setTimeout(() => (box.hidden = true), 100));
}

// ---------- adding things ----------

function addSubject(it, preset = {}) {
  const kind = kindFor(it);
  const dur = preset.durability !== undefined ? String(preset.durability) : $("#new-dur")?.value ?? "100";
  const uses = $("#new-uses")?.value ?? "";
  const s = {
    id: uid(), mode, itemId: it.id, name: it.name, kind,
    durability: kind === "key" || dur === "" ? undefined : Number(dur),
    uses: kind === "key" && uses !== "" ? Number(uses) : undefined,
    apiBaseValue: it.basePrice || undefined,
    owned: 1,
  };
  state.subjects.push(s);
  selected = s.id;
  selectedGun = gunKeyOf(s);
  drafting = false;
  localStorage.setItem(STORE, JSON.stringify(state));
  return s;
}

// A bare gun or preset: reuse the existing full-durability copy, or add it.
function addWeapon(it) {
  const kind = kindFor(it);
  const existing = subjectsFor().find((s) => s.itemId === it.id && s.kind === kind && !s.build && atFull(s));
  if (existing) {
    selected = existing.id;
    selectedGun = gunKeyOf(existing);
    drafting = false;
  } else addSubject(it, { durability: 100 });
  render();
}

function pickSubject(id) {
  const s = subjectById(id);
  if (!s) return;
  selected = id;
  selectedGun = gunKeyOf(s);
  drafting = false;
  render();
}

// Sacrificed stash fillers are gone.
function useUpStash(used) {
  for (const f of used) {
    const st = state.stash[mode].find((s) => (f.itemId ? s.itemId === f.itemId : s.name === f.name));
    if (st) st.count = Math.max(0, st.count - f.qty);
  }
  state.stash[mode] = state.stash[mode].filter((s) => s.count > 0);
}

function record(timer) {
  const plan = currentPlan;
  if (!plan) return;
  state.tests.push({
    id: uid(), mode, createdAt: new Date().toISOString(),
    entries: [{ subjectId: plan.subjectId, qty: plan.qty }],
    fillers: plan.fillers.map((f) => ({ itemId: f.itemId, name: f.name, baseValue: f.baseValue, qty: f.qty })),
    timer, hideoutSkill,
  });
  useUpStash(plan.fillers.filter((f) => f.owned));
  save();
  toast(`Recorded ${timer}.`);
}

// ---------- actions ----------

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.tagName === "INPUT" || btn.tagName === "SELECT") return;
  const { action, id } = btn.dataset;
  if (action === "pick") pickSubject(id);
  else if (action === "pick-gun") {
    selectedGun = btn.dataset.gun;
    selected = null;
    drafting = false;
    render();
  } else if (action === "banner-go") {
    const t = bannerTarget;
    if (t?.subjectId) pickSubject(t.subjectId);
    else if (t?.addItem) {
      const it = items[mode]?.byId.get(t.addItem);
      if (it) addWeapon(it);
    }
    $("#bench").scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (action === "show-rules") {
    $("#d-rules").open = true;
    $("#d-rules").scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (action === "record") record(btn.dataset.timer);
  else if (action === "log") {
    const subject = subjectById(id);
    if (!subject) return;
    const { qty, fill } = logInputs();
    // Same items as suggested: record them by name and use them up.
    const plan = currentPlan?.subjectId === id ? currentPlan : null;
    const same = plan && fill === plan.fillerTotal && qty === plan.qty;
    state.tests.push({
      id: uid(), mode, createdAt: new Date().toISOString(),
      entries: [{ subjectId: id, qty }],
      fillers: same
        ? plan.fillers.map((f) => ({ itemId: f.itemId, name: f.name, baseValue: f.baseValue, qty: f.qty }))
        : fill ? [{ name: "Other known items", baseValue: fill, qty: 1 }] : [],
      timer: btn.dataset.timer, hideoutSkill,
    });
    if (same) useUpStash(plan.fillers.filter((f) => f.owned));
    // Logging 5 copies means you own at least 5, so plans can use them.
    subject.owned = Math.max(subject.owned ?? 1, qty);
    save();
    const leftovers = fill && !same ? " Remove anything you used from My filler items." : "";
    toast(`Recorded ${qty}× ${btn.dataset.timer}.${leftovers}`);
  } else if (action === "add-item") {
    const it = items[mode]?.byId.get(btn.dataset.item);
    if (!it) return toast("Item data not loaded yet.");
    addWeapon(it);
  } else if (action === "control") {
    const plan = controlPlans[Number(btn.dataset.i)];
    if (!plan) return;
    state.tests.push({
      id: uid(), mode, createdAt: new Date().toISOString(), entries: [],
      fillers: plan.picks.map((x) => ({ itemId: x.option.itemId, name: x.option.name, baseValue: x.option.baseValue, qty: x.qty })),
      timer: btn.dataset.timer, notes: `Control: expected ${plan.expect}`, hideoutSkill,
    });
    useUpStash(plan.picks.filter((x) => x.option.owned).map((x) => ({ itemId: x.option.itemId, name: x.option.name, qty: x.qty })));
    save();
    toast(btn.dataset.timer === plan.expect ? "As expected." : "Unexpected timer.");
  } else if (action === "build-new") {
    const g = ctx.groups.get(selectedGun);
    if (!g?.item) return toast("Item data not loaded yet.");
    if (!drafting || draftBuild.gun?.id !== g.item.id) draftBuild = { gun: g.item, mods: [] };
    drafting = true;
    render();
  } else if (action === "build-from") {
    const data = items[mode];
    const preset = btn.dataset.item && data?.byId.get(btn.dataset.item);
    draftBuild.mods = preset
      ? preset.parts.flatMap((p) => { const part = data.byId.get(p.id); return part && !part.types.includes("gun") ? Array(p.count).fill(part) : []; })
      : [];
    render();
  } else if (action === "build-unmod") { draftBuild.mods.splice(Number(btn.dataset.i), 1); render(); }
  else if (action === "build-cancel") { drafting = false; render(); }
  else if (action === "build-create") {
    const { gun, mods } = draftBuild;
    if (!gun || !mods.length) return;
    const grouped = [];
    for (const m of mods) {
      const g = grouped.find((x) => x.itemId === m.id);
      if (g) g.count++;
      else grouped.push({ itemId: m.id, name: m.name, baseValue: m.basePrice, count: 1 });
    }
    const build = { gunValue: gun.basePrice, mods: grouped };
    const s = {
      id: uid(), mode, itemId: gun.id, kind: "weapon", durability: 100, owned: 1,
      name: `${short(gun.name)} + ${grouped.map((m) => `${m.count > 1 ? `${m.count}× ` : ""}${m.name}`).join(" + ")}`,
      apiBaseValue: gun.basePrice + grouped.reduce((sum, m) => sum + m.baseValue * m.count, 0),
      build,
    };
    const dupe = state.subjects.find((x) => subjectKey(x) === subjectKey(s));
    if (dupe) { toast("That build is already listed."); return pickSubject(dupe.id); }
    state.subjects.push(s);
    selected = s.id;
    drafting = false;
    draftBuild = { gun: null, mods: [] };
    save();
    toast("Build saved. Put the sacrifice in the circle.");
  } else if (action === "del-subject") {
    const used = state.tests.filter((t) => t.entries.some((x) => x.subjectId === id)).length;
    if (!confirm(`Remove this item${used ? ` and its ${used} test(s)` : ""}?`)) return;
    state.subjects = state.subjects.filter((s) => s.id !== id);
    state.tests = state.tests.filter((t) => !t.entries.some((x) => x.subjectId === id));
    selected = null;
    save();
  } else if (action === "stash-del") { state.stash[mode].splice(Number(btn.dataset.i), 1); save(); }
  else if (action === "test-del") {
    if (!confirm("Delete this test?")) return;
    state.tests = state.tests.filter((t) => t.id !== id);
    save();
  } else if (action === "manual") {
    const subjectId = $("#m-subject").value;
    if (!subjectId) return toast("Add an item first.");
    const fill = Math.max(0, Number($("#m-fill").value) || 0);
    state.tests.push({
      id: uid(), mode, createdAt: new Date().toISOString(),
      entries: [{ subjectId, qty: Math.max(1, Math.floor(Number($("#m-qty").value) || 1)) }],
      fillers: fill ? [{ name: "Other known items", baseValue: fill, qty: 1 }] : [],
      timer: $("#m-timer").value, notes: $("#m-notes").value || undefined, hideoutSkill,
    });
    save();
  } else if (action === "export") {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(blob), download: `base-value-lab-${new Date().toISOString().slice(0, 10)}.json`,
    });
    a.click();
    URL.revokeObjectURL(a.href);
  } else if (action === "import") $("#import-file").click();
  else if (action === "seed") {
    const res = await fetch("sheet-seed.json");
    if (!res.ok) return toast("sheet-seed.json not found.");
    importState(await res.json(), "sheet tests");
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  const { action, id } = el.dataset;
  if (action === "owned") { subjectById(id).owned = Math.max(1, Number(el.value) || 1); save(); }
  else if (action === "stash-count") { state.stash[mode][Number(el.dataset.i)].count = Math.max(0, Number(el.value) || 0); save(); }
  else if (action === "setting") { state.settings[el.dataset.key] = Math.max(1, Number(el.value) || 1); save(); }
  else if (action === "buy") { buyFillers = el.checked; localStorage.setItem(`${STORE}:buy`, String(buyFillers)); render(); }
  else if (action === "trader") { traderLevel = Math.min(4, Math.max(1, Number(el.value) || 4)); localStorage.setItem(`${STORE}:trader`, String(traderLevel)); render(); }
  else if (action === "test-timer") { state.tests.find((t) => t.id === id).timer = el.value || null; save(); }
  else if (action === "skill") { hideoutSkill = readSkill(el.value); localStorage.setItem(`${STORE}:skill`, hideoutSkill ?? ""); render(); }
  else if (action === "test-skill") { state.tests.find((t) => t.id === id).hideoutSkill = readSkill(el.value); save(); }
  else if (action === "test-exclude") { state.tests.find((t) => t.id === id).excluded = el.checked || undefined; save(); }
});

// Keep the log box's "each worth" hints in step with what's typed.
document.addEventListener("input", (e) => {
  if (e.target.id !== "log-qty" && e.target.id !== "log-fill") return;
  const { qty, fill } = logInputs();
  for (const span of document.querySelectorAll("[data-implies]"))
    span.textContent = impliesText(span.dataset.implies, qty, fill);
});

$("#import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try { importState(JSON.parse(await file.text()), file.name); }
  catch (err) { toast(`Import failed: ${err.message}`); }
});

async function importState(raw, label) {
  let incoming;
  try { incoming = parseState(raw); }
  catch (err) { return toast(`Import failed: ${err.message}`); }
  // Fill in item ids and API values for name-only subjects (sheet imports).
  for (const s of incoming.subjects) {
    const data = await loadItems(s.mode).catch(() => null);
    const it = s.itemId ? data?.byId.get(s.itemId) : data?.byName.get(s.name.toLowerCase());
    if (it) {
      s.itemId = it.id;
      // A build's itemId is its bare gun, so keep the build's own kind.
      if (!s.build) s.kind = kindFor(it);
      s.apiBaseValue ??= it.basePrice || undefined;
    }
  }
  const before = state.tests.length;
  const stashBefore = state.stash.pvp.length + state.stash.pve.length;
  state = combineModes(mergeStates(state, incoming), mode);
  save();
  const stashAdded = state.stash.pvp.length + state.stash.pve.length - stashBefore;
  toast(`Imported ${state.tests.length - before} test(s)${stashAdded ? ` and ${stashAdded} stash item(s)` : ""} from ${label}.`);
}

render();
loadItems(mode).then(render).catch((err) => toast(err.message));
loadRarity().then(render).catch((err) => toast(err.message));
</script>
</body>
</html>
